<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="profile-card">
      <span class="menu">&#8942;</span>

      <img
        src="profile_picture.png"
        alt="Profile picture"
        class="profile-image"
      />

      <h3>MAKARA</h3>
      <p class="job">UI/UX Mobile Designer</p>

      <div class="stats">
        <div>
          <p>Projects</p>
          <b>17</b>
        </div>
        <div>
          <p>Following</p>
          <b>159</b>
        </div>
        <div>
          <p>Followers</p>
          <b>205</b>
        </div>
      </div>

      <p class="bio">
        Lorem ipsum dolor sit amet, consectetur adip<br />
        iscing elit. Sed et est et velit ornare ultrices. Ut vitae<br />
        diam volutpatrisus eget.
      </p>

      <img
        src="social-icons.png"
        alt="Social media icons"
        class="social-icons"
      />

      <button type="button">View Profile</button>
    </div>
  </body>
</html>
